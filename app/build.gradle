plugins {
    id "com.android.application"
}

android {
    namespace "com.padc.tabledemo"
    compileSdk 34

    defaultConfig {
        applicationId "com.padc.tabledemo"
        minSdk 23
        targetSdk 34
        versionCode 5
        versionName "0.4.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
